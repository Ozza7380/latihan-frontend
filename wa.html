<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Form Registrasi</h2>

    <form id="registration">
        <div>
            <label>Nama:</label>
            <input type="text" id="name" placeholder="Tulis nama Anda disini" required>
        </div>
        <!--<div>
            <label>Nomor WhatsApp:</label>
            <input type="text" id="WhatsApp" placeholder="+628xxxxxxxxx" required>
        </div>-->
        <div>
            <label>Alamat:</label>
            <textarea id="Alamat" rows="2" cols="50" placeholder="Jl XXXX, Desa XXXXX. RT XX, RW XX, Kelurahan XXXXX, Kecamatan XXXXX, Kabupaten XXXXXX." required></textarea>
        </div>
        <div>
            <label>Pesanan:</label>
            <textarea id="barang" rows="6" cols="50" placeholder="Tulis pesanan Anda disini" required></textarea>
        </div>
        <button type="submit">Daftar</button>
    </form>
    <script src="wa.js"></script>
</body>
</html>
